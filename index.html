<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FASTFIT — Official Training & Fitness Platform</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-black: #0a0505;
      --bg-deep: #140708;
      --surface-dark: #1c0a0b;
      --surface-card: #261012;
      --accent: #dc2626;
      --accent-bright: #ff5757;
      --brand-red: #b91c1c;
      --text-main: #fff1f2;
      --text-muted: #fecdd3;
      --danger: #ef4444;
      --success: #facc15;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ================= NAVBAR ================= */
    .navbar {
      width: 100%;
      height: 76px;
      background: rgba(10, 5, 5, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 40;
      display: none;
    }

    .nav-container {
      max-width: 1280px;
      height: 100%;
      margin: 0 auto;
      padding: 0 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 26px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 1.5px;
      cursor: pointer;
    }

    .bolt-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-bright));
      color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-style: normal;
      font-size: 22px;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.45);
    }

    .nav-links { display: flex; gap: 28px; }

    .nav-link {
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 4px;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .nav-link:hover, .nav-link.active {
      color: var(--accent-bright);
      border-bottom-color: var(--accent-bright);
    }

    .nav-actions { display: flex; align-items: center; gap: 16px; }
    .user-chip { font-size: 13px; color: var(--text-muted); }
    .user-chip b { color: var(--text-main); }

    .plan-badge {
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .plan-badge.free {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .plan-badge.pro {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-bright);
      border: 1px solid var(--accent-bright);
    }

    /* ================= LOGIN ================= */
    .login-wrapper {
      min-height: 100vh;
      width: 100%;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
    }
    @media (max-width: 900px) {
      .login-wrapper { grid-template-columns: 1fr; }
      .login-promo { display: none !important; }
    }
    .login-promo {
      background: radial-gradient(circle at 20% 30%, #7f1d1d 0%, #0a0505 70%);
      padding: 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }
    .login-promo h1 { font-size: 54px; font-weight: 900; line-height: 1.1; margin: 24px 0 16px; }
    .login-promo p { font-size: 18px; color: var(--text-muted); max-width: 520px; line-height: 1.6; }
    .login-form-side {
      background: var(--bg-deep);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }
    .login-box {
      width: 100%;
      max-width: 420px;
      background: var(--surface-dark);
      padding: 36px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
    }
    .input-field {
      width: 100%;
      background: var(--bg-black);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: white;
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 14px;
    }
    .input-field:focus { outline: none; border-color: var(--accent-bright); }
    .btn-accent {
      width: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright));
      color: #000;
      font-weight: 800;
      border: none;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .btn-accent:hover { transform: translateY(-2px); }
    .divider {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      margin: 20px 0;
      letter-spacing: 1px;
    }
    .social-btn {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      transition: opacity 0.2s;
    }
    .social-btn:hover { opacity: 0.92; }
    .btn-google { background: #ffffff; color: #1a0a0b; }
    .btn-facebook { background: var(--brand-red); color: #ffffff; }

    /* ================= MAIN CONTAINER ================= */
    .web-container {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 36px 32px 64px;
      flex: 1;
    }

    /* ============ Hero Banner ============ */
    .web-hero {
      position: relative;
      border-radius: 24px;
      padding: 44px;
      margin-bottom: 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
      overflow: hidden;
      border: 1px solid rgba(239, 68, 68, 0.35);
      background: #140708;
      isolation: isolate;
      min-height: 240px;
    }
    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      filter: brightness(0.55) saturate(1.1);
      pointer-events: none;
    }
    .hero-bg-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(120deg, rgba(127, 29, 29, 0.86) 0%, rgba(20, 7, 8, 0.92) 100%);
      pointer-events: none;
    }
    .web-hero > *:not(.hero-video):not(.hero-bg-overlay) {
      position: relative;
      z-index: 2;
    }

    .hero-tag {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-bright);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      display: inline-block;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 87, 87, 0.4);
    }
    .web-hero h1 { font-size: 38px; font-weight: 900; margin-bottom: 10px; }
    .web-hero p { color: var(--text-muted); font-size: 16px; max-width: 600px; }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 87, 87, 0.5);
      color: var(--text-main);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 1px;
      backdrop-filter: blur(6px);
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-bright);
      box-shadow: 0 0 8px var(--accent-bright);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* ============ Stats ============ */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 36px;
    }
    .stat-card {
      background: var(--surface-dark);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 24px;
    }
    .stat-value { font-size: 32px; font-weight: 900; color: var(--accent-bright); margin-bottom: 6px; }
    .stat-label { font-size: 13px; color: var(--text-muted); font-weight: 600; }

    /* ============ Filter ============ */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .filter-pills { display: flex; gap: 10px; flex-wrap: wrap; }
    .pill {
      background: var(--surface-dark);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .pill.active { background: var(--accent); color: white; border-color: var(--accent-bright); }

    /* ============ Grid & Cards ============ */
    .workout-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 24px;
    }
    .workout-card {
      background: var(--surface-card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.2s;
      cursor: pointer;
    }
    .workout-card:hover {
      box-shadow: 0 16px 35px rgba(0, 0, 0, 0.55);
    }
    .workout-card.locked { opacity: 0.96; }

    .card-media {
      position: relative;
      height: 190px;
      width: 100%;
      overflow: hidden;
      background-color: #140708;
      background-size: cover;
      background-position: center;
    }
    .card-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: transparent;
    }
    .card-media::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.15) 0%, rgba(0, 0, 0, 0.4) 55%, rgba(38, 16, 18, 1) 100%);
      pointer-events: none;
    }
    .card-cat {
      position: absolute;
      top: 12px;
      left: 14px;
      z-index: 3;
      background: rgba(0, 0, 0, 0.6);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: var(--text-main);
      backdrop-filter: blur(4px);
    }
    .card-chip { position: absolute; top: 12px; right: 14px; z-index: 3; }

    .play-overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .play-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(220, 38, 38, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(255, 87, 87, 0.55);
      transition: opacity 0.25s ease;
    }
    .play-icon svg { width: 20px; height: 20px; fill: #fff; margin-left: 3px; }

    .video-indicator {
      position: absolute;
      bottom: 12px;
      right: 14px;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(0, 0, 0, 0.65);
      color: var(--text-main);
      padding: 4px 9px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.8px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 87, 87, 0.35);
    }
    .video-indicator svg { width: 10px; height: 10px; fill: var(--accent-bright); }

    .lock-overlay {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      color: var(--accent-bright);
      font-size: 34px;
      backdrop-filter: blur(2px);
    }

    .card-body {
      padding: 20px 24px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }
    .pro-chip {
      background: rgba(220, 38, 38, 0.18);
      color: var(--accent-bright);
      border: 1px solid rgba(255, 87, 87, 0.55);
      font-size: 11px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .free-chip {
      background: rgba(16, 185, 129, 0.18);
      color: #10b981;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 6px;
    }

    /* ============ Detail Video Player ============ */
    .video-player-section {
      margin-bottom: 32px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(239, 68, 68, 0.35);
      background: #000;
      position: relative;
    }
    .video-player-section video {
      width: 100%;
      display: block;
      max-height: 560px;
      background: #000;
      object-fit: contain;
    }
    .video-player-label {
      position: absolute;
      top: 16px;
      left: 18px;
      z-index: 5;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.7);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 87, 87, 0.4);
    }

    /* ============ Pricing ============ */
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }
    .price-card {
      background: var(--surface-dark);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .price-card.featured {
      background: linear-gradient(180deg, #450a0a 0%, #140708 100%);
      border: 2px solid var(--accent-bright);
    }

    /* ============ Modal ============ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-box {
      background: var(--surface-dark);
      border: 1px solid var(--accent-bright);
      border-radius: 20px;
      padding: 32px;
      max-width: 500px;
      width: 100%;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-outline:hover {
      border-color: var(--accent-bright);
      color: var(--accent-bright);
    }

    @media (max-width: 520px) {
      .web-hero { padding: 28px; }
      .web-hero h1 { font-size: 26px; }
      .workout-grid { grid-template-columns: 1fr; }
      .web-container { padding: 24px 16px 48px; }
    }
  </style>
</head>

          { name: "High-Plank Shoulder Taps", sets: "3 Sets × 60 Sec", done: false }
        ]
      },
      {
        id: 1,
        title: "Blue Steel Upper Hypertrophy",
        category: "Strength",
        desc: "Heavy compound supersets targeting chest, wide back, and 3D deltoids.",
        duration: "45 Min", kcal: "460 Kcal", level: "Advanced", isPremium: true,
        drills: [
          { name: "Incline Dumbbell Press", sets: "4 Sets × 10 Reps", done: false },
          { name: "Weighted Wide-Grip Pull-Ups", sets: "4 Sets × 8 Reps", done: false },
          { name: "Seated Arnold Shoulder Press", sets: "3 Sets × 12 Reps", done: false },
          { name: "Rope Face Pulls & Tricep Pressdown", sets: "3 Sets × 15 Reps", done: false }
        ]
      },
      {
        id: 2,
        title: "Nitro Leg Power & Explosiveness",
        category: "Strength",
        desc: "Build lower-body strength and sprint power with squats, RDLs, and plyometrics.",
        duration: "50 Min", kcal: "540 Kcal", level: "Pro", isPremium: true,
        drills: [
          { name: "Barbell Back Squat", sets: "4 Sets × 8 Reps", done: false },
          { name: "Romanian Deadlift (RDL)", sets: "4 Sets × 10 Reps", done: false },
          { name: "Bulgarian Split Squats", sets: "3 Sets × 12 Reps/Leg", done: false },
          { name: "Plyometric Box Jumps", sets: "4 Sets × 10 Reps", done: false }
        ]
      },
      {
        id: 3,
        title: "Core Velocity & Six-Pack Shred",
        category: "Core",
        desc: "Targeted abdominal and oblique circuit for rotational power and core definition.",
        duration: "20 Min", kcal: "220 Kcal", level: "All Levels", isPremium: false,
        drills: [
          { name: "Hanging Leg Raises", sets: "4 Sets × 12 Reps", done: false },
          { name: "Weighted Russian Twists", sets: "3 Sets × 20 Reps", done: false },
          { name: "Ab Wheel Rollouts", sets: "3 Sets × 10 Reps", done: false }
        ]
      },
      {
        id: 4,
        title: "Afterburn Metabolic Conditioning",
        category: "Speed HIIT",
        desc: "Non-stop kettlebell and dumbbell conditioning for elite endurance.",
        duration: "35 Min", kcal: "490 Kcal", level: "Pro", isPremium: true,
        drills: [
          { name: "Dumbbell Thrusters", sets: "4 Sets × 15 Reps", done: false },
          { name: "Kettlebell Swings", sets: "4 Sets × 20 Reps", done: false },
          { name: "Renegade Push-Up Rows", sets: "3 Sets × 12 Reps", done: false }
        ]
      },
      {
        id: 5,
        title: "Athletic Mobility & Core Stability",
        category: "Core",
        desc: "Active recovery, deep core stabilization, and joint mobility flow.",
        duration: "30 Min", kcal: "190 Kcal", level: "All Levels", isPremium: true,
        drills: [
          { name: "Copenhagen Side Planks", sets: "3 Sets × 40 Sec/Side", done: false },
          { name: "Deadbug Core Holds", sets: "3 Sets × 12 Reps", done: false },
          { name: "Thoracic Spine Windmills", sets: "3 Sets × 10 Reps", done: false }
        ]
      }
    ];

    const workouts = workoutsBase.map((w, i) => ({
      ...w,
      video: VIDEO_CONFIG[i]?.video || "",
      videoFallback: VIDEO_CONFIG[i]?.fallback || "",
      image: VIDEO_CONFIG[i]?.poster || ""
    }));

    /* ==================== VIDEO HELPERS ==================== */

    function attachVideoHandlers() {
      document.querySelectorAll("video").forEach(video => {
        video.muted = true;
        video.playsInline = true;
        video.setAttribute("playsinline", "");
        video.setAttribute("webkit-playsinline", "");

        video.addEventListener("error", () => {
          console.warn("Video failed to load:", video.currentSrc || "(no src)");
        }, true);
      });
    }

    function pauseAllVideos() {
      document.querySelectorAll("video").forEach(v => {
        try { v.pause(); } catch (e) {}
      });
    }

    /* ==================== LOGIN ==================== */

    renderLoginView();

    function renderLoginView() {
      pauseAllVideos();
      document.getElementById("top-nav").style.display = "none";
      document.getElementById("main-content").innerHTML = `
        <div class="login-wrapper">
          <div class="login-promo">
            <div class="brand-logo">
              <span class="bolt-icon">⚡</span>
              <span>FASTFIT WEB</span>
            </div>
            <h1>TRAIN FASTER.<br><span style="color:var(--accent-bright);">BUILD REAL STRENGTH.</span></h1>
            <p>Access high-voltage HIIT circuits, elite strength hypertrophy programs, live rest timers, and performance analytics right from your browser.</p>
          </div>
          <div class="login-form-side">
            <div class="login-box">
              <h2 style="font-size:24px; margin-bottom:6px;">Sign In to FastFit</h2>
              <p style="color:var(--text-muted); font-size:13px; margin-bottom:22px;">Choose your preferred login method to access your dashboard</p>
              <input type="email" id="login-email" class="input-field" placeholder="Email address" />
              <input type="password" class="input-field" placeholder="Password" />
              <button class="btn-accent" onclick="handleLogin('Athlete', 'Email')">Sign In with Email</button>
              <div class="divider">OR CONTINUE WITH</div>
              <button class="social-btn btn-google" onclick="handleLogin('Google Athlete', 'Google')">
                <span style="font-weight:900; color:#ea4335; font-size:16px;">G</span>
                <span>Continue with Google</span>
              </button>
              <button class="social-btn btn-facebook" onclick="handleLogin('Facebook Athlete', 'Facebook')">
                <span style="font-weight:900; font-size:16px;">f</span>
                <span>Continue with Facebook</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function handleLogin(defaultName, provider) {
      const emailVal = document.getElementById("login-email")?.value?.trim();
      currentUser = { name: emailVal ? emailVal.split("@")[0] : defaultName, provider };
      document.getElementById("top-nav").style.display = "block";
      updateNavbarStatus();
      switchPage("dashboard");
    }

    function logout() { currentUser = null; renderLoginView(); }

    function updateNavbarStatus() {
      document.getElementById("user-display").innerHTML =
        `Signed in as <b>${currentUser.name}</b> (${currentUser.provider})`;
      const badge = document.getElementById("nav-plan-badge");
      if (isPro) {
        badge.className = "plan-badge pro";
        badge.innerText = `💎 ${activePlanTitle.toUpperCase()}`;
      } else {
        badge.className = "plan-badge free";
        badge.innerText = "🔒 FREE PLAN";
      }
    }

    function switchPage(page) {
      pauseAllVideos();
      ["dashboard", "workouts", "pricing"].forEach(id => {
        document.getElementById("link-" + id)?.classList.toggle("active", id === page);
      });
      if (page === "dashboard") renderDashboardPage();
      else if (page === "workouts") renderWorkoutsPage();
      else if (page === "pricing") renderPricingPage();
    }

    function getCompletedCount() {
      return workouts.reduce((sum, w) => sum + w.drills.filter(d => d.done).length, 0);
    }

    /* ==================== DASHBOARD ==================== */

    function renderDashboardPage() {
      pauseAllVideos();
      const doneDrills = getCompletedCount();
      const filtered = selectedCategory === "All"
        ? workouts
        : workouts.filter(w => w.category === selectedCategory);
      const heroWorkout = workouts[0];

      document.getElementById("main-content").innerHTML = `
        <div class="web-container">
          <div class="web-hero">
            <video class="hero-video" muted playsinline preload="none"
                   poster="${heroWorkout.image}">
              <source src="${heroWorkout.video}" type="video/mp4">
              <source src="${heroWorkout.videoFallback}" type="video/mp4">
            </video>
            <div class="hero-bg-overlay"></div>
            <div>
              <div style="display:flex; align-items:center; flex-wrap:wrap; gap:8px;">
                <span class="hero-tag" style="margin-bottom:0;">⚡ DAILY FEATURED TRACK</span>
                <span class="live-badge"><span class="live-dot"></span>LIVE PREVIEW</span>
              </div>
              <h1 style="margin-top:14px;">25-Minute Nitro HIIT Challenge</h1>
              <p>Push your pace with explosive intervals designed to maximize caloric afterburn.</p>
            </div>
            <div style="display:flex; gap:14px; flex-wrap:wrap;">
              <button class="btn-accent" style="width:auto; padding:14px 28px;" onclick="openWorkoutView(0)">▶ Start Workout Now</button>
              ${!isPro ? `<button class="btn-outline" style="padding:14px 24px;" onclick="openCodeModal()">💎 Unlock All PRO Tracks</button>` : ""}
            </div>
          </div>

          <div class="stats-row">
            <div class="stat-card"><div class="stat-value">${doneDrills * 95}</div><div class="stat-label">CALORIES BURNED TODAY</div></div>
            <div class="stat-card"><div class="stat-value">${doneDrills * 7} Min</div><div class="stat-label">ACTIVE TRAINING TIME</div></div>
            <div class="stat-card"><div class="stat-value">${doneDrills}</div><div class="stat-label">COMPLETED DRILLS</div></div>
            <div class="stat-card"><div class="stat-value" style="font-size:22px;">${activePlanTitle}</div><div class="stat-label">CURRENT MEMBERSHIP</div></div>
          </div>

          <div class="filter-bar">
            <h2 style="font-size:24px;">Training Programs</h2>
            <div class="filter-pills">
              ${["All", "Speed HIIT", "Strength", "Core"].map(cat => `
                <button class="pill ${selectedCategory === cat ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>
              `).join("")}
            </div>
          </div>

          <div class="workout-grid">
            ${filtered.map(w => renderWorkoutCardHTML(w)).join("")}
          </div>
        </div>
      `;
      attachVideoHandlers();
    }

    /* ==================== WORKOUT CARD ==================== */

    function renderWorkoutCardHTML(w) {
      const locked = w.isPremium && !isPro;
      return `
        <div class="workout-card ${locked ? 'locked' : ''}" onclick="openWorkoutView(${w.id})">
          <div class="card-media" style="background-image:url('${w.image}');">
            <video class="card-video" muted playsinline preload="none" poster="${w.image}">
              <source src="${w.video}" type="video/mp4">
              <source src="${w.videoFallback}" type="video/mp4">
            </video>
            <span class="card-cat">${w.category.toUpperCase()}</span>
            <span class="card-chip">
              ${w.isPremium ? `<span class="pro-chip">💎 PRO</span>` : `<span class="free-chip">FREE</span>`}
            </span>
            <span class="play-overlay">
              <span class="play-icon">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </span>
            </span>
            <span class="video-indicator">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              VIDEO
            </span>
            ${locked ? `<div class="lock-overlay">🔒</div>` : ``}
          </div>
          <div class="card-body">
            <div>
              <h3 style="font-size:20px; margin-bottom:8px;">${w.title}</h3>
              <p style="color:var(--text-muted); font-size:14px; line-height:1.5; margin-bottom:20px;">${w.desc}</p>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding-top:16px; border-top:1px solid rgba(255,255,255,0.08);">
              <div style="font-size:13px; color:var(--accent-bright); font-weight:700;">⏱ ${w.duration} &nbsp;•&nbsp; 🔥 ${w.kcal}</div>
              <button class="btn-outline" style="padding:6px 14px; font-size:13px;">${locked ? "🔒 Unlock" : "▶ Open Track"}</button>
            </div>
          </div>
        </div>
      `;
    }

    function setCategory(cat) { selectedCategory = cat; renderDashboardPage(); }

    /* ==================== ALL WORKOUTS ==================== */

    function renderWorkoutsPage() {
      pauseAllVideos();
      document.getElementById("main-content").innerHTML = `
        <div class="web-container">
          <h1 style="font-size:32px; margin-bottom:8px;">All FastFit Training Tracks</h1>
          <p style="color:var(--text-muted); margin-bottom:28px;">Select any workout below to view drills, sets, video demos, and the interactive rest timer.</p>
          <div class="workout-grid">
            ${workouts.map(w => renderWorkoutCardHTML(w)).join("")}
          </div>
        </div>
      `;
      attachVideoHandlers();
    }

    /* ==================== WORKOUT DETAIL ==================== */

    function openWorkoutView(id) {
      pauseAllVideos();
      const w = workouts[id];
      if (w.isPremium && !isPro) { openCodeModal(); return; }

      document.getElementById("main-content").innerHTML = `
        <div class="web-container">
          <button class="btn-outline" style="margin-bottom:24px;" onclick="switchPage('dashboard')">❮ Back to Dashboard</button>

          <div class="web-hero" style="margin-bottom:28px; padding:32px;">
            <video class="hero-video" muted playsinline preload="none"
                   poster="${w.image}">
              <source src="${w.video}" type="video/mp4">
              <source src="${w.videoFallback}" type="video/mp4">
            </video>
            <div class="hero-bg-overlay"></div>
            <div>
              <div style="display:flex; align-items:center; flex-wrap:wrap; gap:8px;">
                <span class="hero-tag" style="margin-bottom:0;">${w.category.toUpperCase()} • ${w.level.toUpperCase()}</span>
                <span class="live-badge"><span class="live-dot"></span>PREVIEW</span>
              </div>
              <h1 style="margin-top:14px;">${w.title}</h1>
              <p>${w.desc}</p>
            </div>
            <div style="background:rgba(0,0,0,0.65); padding:20px 26px; border-radius:16px; border:1px solid var(--accent-bright); backdrop-filter:blur(6px);">
              <div id="web-timer-label" style="font-size:16px; font-weight:800; color:var(--accent-bright); margin-bottom:10px;">⏱ Rest Timer: 45 Seconds</div>
              <button class="btn-accent" onclick="startWebRestTimer()">Start 45s Rest</button>
            </div>
          </div>

          <div class="video-player-section">
            <span class="video-player-label">
              <svg viewBox="0 0 24 24" style="width:12px;height:12px;fill:var(--accent-bright);"><path d="M8 5v14l11-7z"/></svg>
              WORKOUT DEMO VIDEO
            </span>
            <video controls playsinline preload="metadata" poster="${w.image}">
              <source src="${w.video}" type="video/mp4">
              <source src="${w.videoFallback}" type="video/mp4">
              Your browser does not support the video tag.
            </video>
          </div>

          <h3 style="font-size:20px; margin-bottom:16px;">Workout Drills (Click to mark complete)</h3>
          <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(460px, 1fr)); gap:16px;">
            ${w.drills.map((d, i) => `
              <div onclick="toggleDrill(${w.id},${i})"
                   style="background:var(--surface-dark); border:1px solid rgba(255,255,255,0.08); padding:20px; border-radius:14px; display:flex; align-items:center; gap:16px; cursor:pointer;">
                <input type="checkbox" ${d.done ? "checked" : ""} style="width:22px; height:22px; accent-color:var(--accent-bright);" />
                <div>
                  <h4 style="font-size:17px; margin-bottom:4px; ${d.done ? 'text-decoration:line-through; color:var(--text-muted);' : ''}">${d.name}</h4>
                  <p style="color:var(--accent-bright); font-size:13px; font-weight:600;">${d.sets}</p>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
      attachVideoHandlers();
    }

    function toggleDrill(wId, dIdx) {
      workouts[wId].drills[dIdx].done = !workouts[wId].drills[dIdx].done;
      openWorkoutView(wId);
    }

    function startWebRestTimer() {
      clearInterval(restInterval);
      restTimeRemaining = 45;
      const lbl = document.getElementById("web-timer-label");
      if (lbl) lbl.innerText = `⚡ Rest Remaining: ${restTimeRemaining}s`;
      restInterval = setInterval(() => {
        restTimeRemaining--;
        const currentLbl = document.getElementById("web-timer-label");
        if (!currentLbl) { clearInterval(restInterval); return; }
        if (restTimeRemaining > 0) {
          currentLbl.innerText = `⚡ Rest Remaining: ${restTimeRemaining}s`;
        } else {
          clearInterval(restInterval);
          currentLbl.innerText = `✅ Rest Complete! Start Next Set!`;
        }
      }, 1000);
    }

    /* ==================== PRICING ==================== */

    function renderPricingPage() {
      pauseAllVideos();
      document.getElementById("main-content").innerHTML = `
        <div class="web-container">
          <div style="text-align:center; max-width:680px; margin:0 auto 40px;">
            <span class="hero-tag">💎 FASTFIT PRO MEMBERSHIP</span>
            <h1 style="font-size:38px; margin-bottom:12px;">Choose Your Training Plan</h1>
            <p style="color:var(--text-muted); font-size:16px;">Unlock all PRO strength & conditioning programs immediately using a subscription code.</p>
          </div>
          <div class="pricing-grid">
            <div class="price-card">
              <div>
                <h3 style="font-size:20px; margin-bottom:8px;">30-Day Speed Pass</h3>
                <div style="font-size:36px; font-weight:900; margin-bottom:16px;">$7.99<span style="font-size:15px; color:var(--text-muted);">/mo</span></div>
                <p style="color:var(--text-muted); font-size:14px; margin-bottom:24px;">Full access to all PRO HIIT and Strength workouts for 30 days.</p>
              </div>
              <button class="btn-outline" style="width:100%; padding:12px;" onclick="fillAndOpen('NITRO99')">Use Code: NITRO99</button>
            </div>
            <div class="price-card featured">
              <div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                  <h3 style="font-size:20px; color:var(--accent-bright);">1-Year Pro Pass</h3>
                  <span class="pro-chip">BEST VALUE</span>
                </div>
                <div style="font-size:36px; font-weight:900; margin-bottom:16px;">$49.99<span style="font-size:15px; color:var(--text-muted);">/yr</span></div>
                <p style="color:var(--text-muted); font-size:14px; margin-bottom:24px;">Complete annual access to every workout track, hypertrophy program, and priority coaching.</p>
              </div>
              <button class="btn-accent" onclick="fillAndOpen('FAST2026')">Use Code: FAST2026</button>
            </div>
            <div class="price-card">
              <div>
                <h3 style="font-size:20px; margin-bottom:8px;">Lifetime VIP Access</h3>
                <div style="font-size:36px; font-weight:900; margin-bottom:16px;">$129<span style="font-size:15px; color:var(--text-muted);">/once</span></div>
                <p style="color:var(--text-muted); font-size:14px; margin-bottom:24px;">Permanent unlimited access to all current and future FastFit Pro releases.</p>
              </div>
              <button class="btn-outline" style="width:100%; padding:12px;" onclick="fillAndOpen('BLUEPRO')">Use Code: BLUEPRO</button>
            </div>
          </div>
        </div>
      `;
    }

    /* ==================== MODAL ==================== */

    function openCodeModal() {
      document.getElementById("modal-code-msg").innerText = "";
      document.getElementById("code-modal").style.display = "flex";
    }
    function closeCodeModal() { document.getElementById("code-modal").style.display = "none"; }
    function fillCode(code) { document.getElementById("modal-code-input").value = code; }
    function fillAndOpen(code) { openCodeModal(); fillCode(code); }
    function activateCode(inputId, msgId) {
      const code = document.getElementById(inputId).value.trim().toUpperCase();
      const msgEl = document.getElementById(msgId);
      if (SUBSCRIPTION_CODES[code]) {
        isPro = true;
        activePlanTitle = SUBSCRIPTION_CODES[code];
        msgEl.style.color = "var(--success)";
        msgEl.innerText = `✅ Activated: ${activePlanTitle}!`;
        updateNavbarStatus();
        setTimeout(() => { closeCodeModal(); switchPage("dashboard"); }, 650);
      } else {
        msgEl.style.color = "var(--danger)";
        msgEl.innerText = "❌ Invalid code. Try FAST2026, BLUEPRO, NITRO99, or COACHVIP.";
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) pauseAllVideos();
    });
  </script>
</body>
</html>
