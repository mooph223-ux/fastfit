<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FASTFIT — Official Training & Fitness Platform</title>
  <style>
    :root { color-scheme: dark; --bg-black: #0a0505; --bg-deep: #140708; --surface-dark: #1c0a0b; --surface-card: #261012; --accent: #dc2626; --accent-bright: #ff5757; --text-main: #fff1f2; --text-muted: #fecdd3; --danger: #ef4444; --success: #10b981; --warning: #facc15; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-black); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    
    /* NAVBAR */
    .navbar { width: 100%; height: 76px; background: rgba(10, 5, 5, 0.88); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); position: sticky; top: 0; z-index: 40; display: none; }
    .nav-container { max-width: 1280px; height: 100%; margin: 0 auto; padding: 0 32px; display: flex; justify-content: space-between; align-items: center; }
    .brand-logo { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 900; font-style: italic; letter-spacing: 1.5px; cursor: pointer; }
    .bolt-icon { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent-bright)); color: #000; display: flex; justify-content: center; align-items: center; font-style: normal; font-size: 22px; box-shadow: 0 0 20px rgba(239, 68, 68, 0.45); }
    .nav-links { display: flex; gap: 28px; align-items: center; }
    .nav-link { color: var(--text-muted); font-size: 15px; font-weight: 600; cursor: pointer; padding: 8px 4px; border-bottom: 2px solid transparent; transition: all 0.2s; }
    .nav-link:hover, .nav-link.active { color: var(--accent-bright); border-bottom-color: var(--accent-bright); }
    .nav-actions { display: flex; align-items: center; gap: 16px; }
    .user-chip { font-size: 13px; color: var(--text-muted); }
    .user-chip b { color: var(--text-main); }
    .plan-badge { padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 800; cursor: pointer; }
    .plan-badge.free { background: rgba(255, 255, 255, 0.08); color: var(--text-muted); border: 1px solid rgba(255, 255, 255, 0.15); }
    .plan-badge.pro { background: rgba(239, 68, 68, 0.15); color: var(--accent-bright); border: 1px solid var(--accent-bright); }
    
    /* LOGIN */
    .login-wrapper { min-height: 100vh; width: 100%; display: grid; grid-template-columns: 1.15fr 0.85fr; }
    @media (max-width: 900px) { .login-wrapper { grid-template-columns: 1fr; } .login-promo { display: none !important; } }
    .login-promo { background: radial-gradient(circle at 20% 30%, #7f1d1d 0%, #0a0505 70%); padding: 64px; display: flex; flex-direction: column; justify-content: center; border-right: 1px solid rgba(255, 255, 255, 0.08); }
    .login-promo h1 { font-size: 54px; font-weight: 900; line-height: 1.1; margin: 24px 0 16px; }
    .login-promo p { font-size: 18px; color: var(--text-muted); max-width: 520px; line-height: 1.6; }
    .login-form-side { background: var(--bg-deep); display: flex; justify-content: center; align-items: center; padding: 40px; }
    .login-box { width: 100%; max-width: 420px; background: var(--surface-dark); padding: 36px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6); }
    .input-field { width: 100%; background: var(--bg-black); border: 1px solid rgba(255, 255, 255, 0.12); color: white; padding: 14px 16px; border-radius: 10px; margin-bottom: 14px; font-size: 14px; }
    .input-field:focus { outline: none; border-color: var(--accent-bright); }
    .btn-accent { width: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-bright)); color: #000; font-weight: 800; border: none; padding: 14px 20px; border-radius: 10px; font-size: 15px; cursor: pointer; transition: transform 0.15s; }
    .btn-accent:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-accent:hover:not(:disabled) { transform: translateY(-2px); }
    .divider { text-align: center; color: var(--text-muted); font-size: 12px; margin: 20px 0; letter-spacing: 1px; }
    .social-btn { width: 100%; padding: 13px; border-radius: 10px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 12px; transition: opacity 0.2s; background: #ffffff; color: #1a0a0b; }
    .social-btn:hover { opacity: 0.92; }
    
    /* MAIN CONTENT */
    .web-container { max-width: 1280px; width: 100%; margin: 0 auto; padding: 36px 32px 64px; flex: 1; }
    .web-hero { position: relative; border-radius: 24px; padding: 44px; margin-bottom: 36px; display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; overflow: hidden; border: 1px solid rgba(239, 68, 68, 0.35); background: #140708; isolation: isolate; min-height: 240px; }
    .hero-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; filter: brightness(0.55) saturate(1.1); pointer-events: none; }
    .hero-bg-overlay { position: absolute; inset: 0; z-index: 1; background: linear-gradient(120deg, rgba(127, 29, 29, 0.86) 0%, rgba(20, 7, 8, 0.92) 100%); pointer-events: none; }
    .web-hero > *:not(.hero-video):not(.hero-bg-overlay) { position: relative; z-index: 2; }
    .hero-tag { background: rgba(239, 68, 68, 0.15); color: var(--accent-bright); padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 800; letter-spacing: 1px; display: inline-block; margin-bottom: 14px; border: 1px solid rgba(255, 87, 87, 0.4); }
    .web-hero h1 { font-size: 38px; font-weight: 900; margin-bottom: 10px; }
    .web-hero p { color: var(--text-muted); font-size: 16px; max-width: 600px; }
    
    /* GRID & CARDS */
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 36px; }
    .stat-card { background: var(--surface-dark); border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 16px; padding: 24px; }
    .stat-value { font-size: 32px; font-weight: 900; color: var(--accent-bright); margin-bottom: 6px; }
    .stat-label { font-size: 13px; color: var(--text-muted); font-weight: 600; }
    .filter-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
    .filter-pills { display: flex; gap: 10px; flex-wrap: wrap; }
    .pill { background: var(--surface-dark); color: var(--text-muted); border: 1px solid rgba(255, 255, 255, 0.1); padding: 9px 18px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .pill.active { background: var(--accent); color: white; border-color: var(--accent-bright); }
    .workout-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 24px; }
    .workout-card { background: var(--surface-card); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
    .workout-card:hover { transform: translateY(-4px); box-shadow: 0 16px 35px rgba(0, 0, 0, 0.55); }
    .workout-card.locked { opacity: 0.96; }
    .card-media { position: relative; height: 190px; width: 100%; overflow: hidden; background-color: #140708; background-size: cover; background-position: center; }
    .card-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; background: transparent; transition: transform 0.5s ease; }
    .workout-card:hover .card-video { transform: scale(1.06); }
    .card-media::after { content: ""; position: absolute; inset: 0; z-index: 2; background: linear-gradient(180deg, rgba(0, 0, 0, 0.15) 0%, rgba(0, 0, 0, 0.4) 55%, rgba(38, 16, 18, 1) 100%); pointer-events: none; }
    .card-cat { position: absolute; top: 12px; left: 14px; z-index: 3; background: rgba(0, 0, 0, 0.6); padding: 5px 10px; border-radius: 6px; font-size: 10.5px; font-weight: 800; letter-spacing: 1.2px; color: var(--text-main); backdrop-filter: blur(4px); }
    .card-chip { position: absolute; top: 12px; right: 14px; z-index: 3; }
    .play-overlay { position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .play-icon { width: 52px; height: 52px; border-radius: 50%; background: rgba(220, 38, 38, 0.9); border: 2px solid rgba(255, 255, 255, 0.6); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 24px rgba(255, 87, 87, 0.55); }
    .play-icon svg { width: 20px; height: 20px; fill: #fff; margin-left: 3px; }
    .video-indicator { position: absolute; bottom: 12px; right: 14px; z-index: 3; display: inline-flex; align-items: center; gap: 5px; background: rgba(0, 0, 0, 0.65); color: var(--text-main); padding: 4px 9px; border-radius: 20px; font-size: 10px; font-weight: 800; letter-spacing: 0.8px; backdrop-filter: blur(6px); border: 1px solid rgba(255, 87, 87, 0.35); }
    .video-indicator svg { width: 10px; height: 10px; fill: var(--accent-bright); }
    .lock-overlay { position: absolute; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.55); color: var(--accent-bright); font-size: 34px; backdrop-filter: blur(2px); }
    .card-body { padding: 20px 24px 22px; display: flex; flex-direction: column; justify-content: space-between; flex: 1; }
    .pro-chip { background: rgba(220, 38, 38, 0.18); color: var(--accent-bright); border: 1px solid rgba(255, 87, 87, 0.55); font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; }
    .free-chip { background: rgba(16, 185, 129, 0.18); color: #10b981; font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 6px; }
    
    /* MODAL & BUTTONS */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(6px); display: none; justify-content: center; align-items: center; padding: 20px; z-index: 100; }
    .modal-box { background: var(--surface-dark); border: 1px solid var(--accent-bright); border-radius: 20px; padding: 32px; max-width: 500px; width: 100%; }
    .btn-outline { background: transparent; border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; }
    .btn-outline:hover { border-color: var(--accent-bright); color: var(--accent-bright); }
    
    /* ADMIN PANEL */
    .admin-card { background: var(--surface-dark); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
    .admin-table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 14px; }
    .admin-table th { text-align: left; padding: 12px; border-bottom: 2px solid var(--accent); color: var(--accent-bright); }
    .admin-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge-used { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .badge-unused { background: rgba(16, 185, 129, 0.2); color: var(--success); }

    /* COMMUNITY FEED */
    .feed-container { max-width: 680px; margin: 0 auto; }
    .create-post { background: var(--surface-dark); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; margin-bottom: 24px; }
    .post-card { background: var(--surface-dark); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 20px; margin-bottom: 16px; transition: border-color 0.2s; }
    .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-bright)); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; color: #000; }
    .post-content { font-size: 15px; line-height: 1.5; margin-bottom: 16px; color: var(--text-main); }
    .post-actions { display: flex; gap: 16px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 12px; }
    .action-btn { background: transparent; border: none; color: var(--text-muted); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: color 0.2s; }
    .action-btn:hover { color: var(--accent-bright); }
    .action-btn.liked { color: var(--danger); }
    
    @media (max-width: 520px) { .web-hero { padding: 28px; } .web-hero h1 { font-size: 26px; } .workout-grid { grid-template-columns: 1fr; } .web-container { padding: 24px 16px 48px; } }
  </style>
</head>

              <button class="social-btn" onclick="window.handleGoogleLogin()">
                <span style="font-weight:900; color:#ea4335; font-size:16px;">G</span>
                <span>Continue with Google</span>
              </button>
            </div>
          </div>
        </div>`;
    };

    window.updateNavbarStatus = function() {
      document.getElementById("user-display").innerHTML = `Signed in as <b>${currentUser.name}</b>`;
      const badge = document.getElementById("nav-plan-badge");
      if (isPro) { badge.className = "plan-badge pro"; badge.innerText = `💎 ${activePlanTitle.toUpperCase()}`; }
      else { badge.className = "plan-badge free"; badge.innerText = "🔒 FREE PLAN"; }
      
      if (currentUser.email === ADMIN_EMAIL) { document.getElementById("link-admin").style.display = "block"; } 
      else { document.getElementById("link-admin").style.display = "none"; }
    };

    window.switchPage = function(page) {
      pauseAllVideos();
      
      // إيقاف التحديث الفوري لو كنا في صفحة الكوميونيتي وطلعنا منها
      if (unsubscribeFeed && page !== 'community') {
        unsubscribeFeed();
        unsubscribeFeed = null;
      }

      ["dashboard", "community", "workouts", "pricing", "admin"].forEach(id => { 
        document.getElementById("link-" + id)?.classList.remove("active"); 
        document.getElementById("link-" + id)?.classList.toggle("active", id === page); 
      });

      if (page === "dashboard") renderDashboardPage(); 
      else if (page === "community") renderCommunityPage();
      else if (page === "workouts") renderWorkoutsPage(); 
      else if (page === "pricing") renderPricingPage();
      else if (page === "admin") renderAdminPage();
    };

    // ==========================================
    // COMMUNITY PLATFORM
    // ==========================================
    function renderCommunityPage() {
      pauseAllVideos();
      document.getElementById("main-content").innerHTML = `
        <div class="web-container">
          <div class="feed-container">
            <h1 style="font-size:32px; margin-bottom:8px; font-weight:900;">Community Feed</h1>
            <p style="color:var(--text-muted); margin-bottom:24px;">Share your progress, motivate others, and connect with athletes.</p>
            
            <div class="create-post">
              <div class="post-header">
                <div class="avatar" style="width:32px; height:32px; font-size:14px;">${currentUser.name.charAt(0).toUpperCase()}</div>
                <h4 style="font-size:14px; font-weight:700;">${currentUser.name}</h4>
              </div>
              <textarea id="post-content" class="input-field" rows="3" placeholder="What's your workout today?" style="resize:none;"></textarea>
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span id="post-msg" style="font-size:12px; color:var(--danger);"></span>
                <button class="btn-accent" style="width:auto; padding:10px 24px;" onclick="window.createPost()">Post</button>
              </div>
            </div>

            <div id="feed-list">
              <div style="text-align:center; padding:20px; color:var(--text-muted);">Loading feed...</div>
            </div>
          </div>
        </div>
      `;

      // فتح اتصال مباشر مع الداتا بيز عشان البوستات تظهر أول بأول
      const q = query(collection(db, "community_posts"), orderBy("createdAt", "desc"));
      unsubscribeFeed = onSnapshot(q, (snapshot) => {
        const feedList = document.getElementById("feed-list");
        if (!feedList) return;
        
        if (snapshot.empty) {
          feedList.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">No posts yet. Be the first to share!</div>`;
          return;
        }

        let html = "";
        snapshot.forEach((doc) => {
          const post = doc.data();
          const isLiked = post.likes && post.likes.includes(currentUser.email);
          const time = post.createdAt ? new Date(post.createdAt.toMillis()).toLocaleDateString() : 'Just now';
          
          html += `
            <div class="post-card">
              <div class="post-header">
                <div class="avatar">${post.authorName.charAt(0).toUpperCase()}</div>
                <div>
                  <h4 style="font-size:14px; font-weight:700;">${post.authorName}</h4>
                  <span style="font-size:11px; color:var(--text-muted);">${time}</span>
                </div>
              </div>
              <div class="post-content">${post.content}</div>
              <div class="post-actions">
                <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="window.toggleLike('${doc.id}', ${isLiked})">
                  ${isLiked ? '❤️' : '🤍'} ${post.likes ? post.likes.length : 0} Likes
                </button>
              </div>
            </div>
          `;
        });
        feedList.innerHTML = html;
      }, (error) => {
        console.error("Feed Error:", error);
        document.getElementById("feed-list").innerHTML = `<div style="color:var(--danger);">Failed to load feed. Check Database permissions.</div>`;
      });
    }

    window.createPost = async function() {
      const content = document.getElementById("post-content").value.trim();
      const msgEl = document.getElementById("post-msg");
      if (!content) { msgEl.innerText = "❌ Post cannot be empty."; return; }
      msgEl.innerText = "";

      try {
        await addDoc(collection(db, "community_posts"), {
          authorName: currentUser.name,
          authorEmail: currentUser.email,
          content: content,
          likes: [],
          createdAt: serverTimestamp()
        });
        document.getElementById("post-content").value = "";
      } catch (error) {
        console.error("Error adding post:", error);
        msgEl.innerText = "❌ Error posting. Try again.";
      }
    };

    window.toggleLike = async function(postId, isCurrentlyLiked) {
      try {
        const postRef = doc(db, "community_posts", postId);
        if (isCurrentlyLiked) {
          // إزالة اللايك
          await updateDoc(postRef, { likes: arrayRemove(currentUser.email) });
        } else {
          // إضافة لايك
          await updateDoc(postRef, { likes: arrayUnion(currentUser.email) });
        }
      } catch (error) {
        console.error("Error liking post:", error);
      }
    };

    // ==========================================
    // ADMIN PANEL & OTHERS (Copied from previous)
    // ==========================================
    async function renderAdminPage() {
      pauseAllVideos();
      document.getElementById("main-content").innerHTML = `
        <div class="web-container">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
            <h1 style="font-size:32px; font-weight:900; color:var(--success);">👑 Admin Control Panel</h1>
          </div>
          <div class="admin-card">
            <h2 style="font-size:20px; margin-bottom:16px;">Generate New Code</h2>
            <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end;">
              <div style="flex:1; min-width:250px;">
                <select id="admin-plan-type" class="input-field" style="margin-bottom:0; appearance:auto;">
                  <option value="30-Day Speed Pass">30-Day Speed Pass</option>
                  <option value="1-Year Pro Pass">1-Year Pro Pass</option>
                  <option value="Lifetime VIP Access">Lifetime VIP Access</option>
                  <option value="Trainer Exclusive Plan">Trainer Exclusive Plan</option>
                </select>
              </div>
              <button class="btn-accent" style="width:auto; padding:14px 24px;" onclick="window.generateAdminCode()">Generate & Save</button>
            </div>
            <div id="admin-gen-result" style="margin-top:20px; font-size:18px; font-weight:bold; color:var(--success);"></div>
          </div>
          <div class="admin-card">
            <h2 style="font-size:20px; margin-bottom:16px;">All Activation Codes</h2>
            <div style="overflow-x:auto;">
              <table class="admin-table">
                <thead><tr><th>Code</th><th>Plan</th><th>Status</th><th>Used By</th></tr></thead>
                <tbody id="admin-codes-tbody"><tr><td colspan='4'>Loading...</td></tr></tbody>
              </table>
            </div>
            <button class="btn-outline" style="margin-top:16px;" onclick="window.loadAllCodes()">🔄 Refresh List</button>
          </div>
        </div>
      `;
      window.loadAllCodes();
    }

    window.loadAllCodes = async function() {
      const tbody = document.getElementById("admin-codes-tbody");
      if (!tbody) return;
      tbody.innerHTML = "<tr><td colspan='4'>Fetching...</td></tr>";
      try {
        const querySnapshot = await getDocs(collection(db, "activation_codes"));
        if (querySnapshot.empty) { tbody.innerHTML = "<tr><td colspan='4'>No codes found.</td></tr>"; return; }
        let html = "";
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const statusBadge = data.is_used ? `<span class="badge badge-used">USED</span>` : `<span class="badge badge-unused">AVAILABLE</span>`;
          html += `<tr><td style="font-weight:bold; color:var(--accent-bright);">${doc.id}</td><td>${data.plan || 'Unknown'}</td><td>${statusBadge}</td><td style="font-size:12px; color:var(--text-muted);">${data.used_by || '-'}</td></tr>`;
        });
        tbody.innerHTML = html;
      } catch (error) { tbody.innerHTML = "<tr><td colspan='4' style='color:var(--danger);'>Error loading codes.</td></tr>"; }
    };

    window.generateAdminCode = async function() {
      const planType = document.getElementById("admin-plan-type").value;
      const resultDiv = document.getElementById("admin-gen-result");
      const randomCode = "FF-" + Math.random().toString(36).substring(2, 8).toUpperCase();
      resultDiv.style.color = "var(--text-muted)"; resultDiv.innerText = "Saving...";
      try {
        await setDoc(doc(db, "activation_codes", randomCode), { plan: planType, is_used: false, created_at: new Date() });
        resultDiv.style.color = "var(--success)";
        resultDiv.innerHTML = `✅ Generated: <span style="font-size:24px; letter-spacing:2px; color:var(--accent-bright);">${randomCode}</span> (Copied!)`;
        navigator.clipboard.writeText(randomCode).catch(e => console.log(e));
        window.loadAllCodes();
      } catch (error) { resultDiv.style.color = "var(--danger)"; resultDiv.innerText = "❌ Error saving."; }
    };

    // DASHBOARD & WORKOUTS (Shortened for brevity, logic is same as before)
    function getCompletedCount() { return workouts.reduce((sum, w) => sum + w.drills.filter(d => d.done).length, 0); }
    function renderDashboardPage() {
      pauseAllVideos();
      const doneDrills = getCompletedCount();
      const filtered = selectedCategory === "All" ? workouts : workouts.filter(w => w.category === selectedCategory);
      const heroWorkout = workouts[0];
      document.getElementById("main-content").innerHTML = `
        <div class="web-container">
          <div class="web-hero">
            <video class="hero-video" autoplay muted loop playsinline preload="auto" poster="${heroWorkout.image}"><source src="${heroWorkout.video}" type="video/mp4"><source src="${heroWorkout.videoFallback}" type="video/mp4"></video>
            <div class="hero-bg-overlay"></div>
            <div>
              <div style="display:flex; align-items:center; flex-wrap:wrap; gap:8px;"><span class="hero-tag" style="margin-bottom:0;">⚡ DAILY FEATURED TRACK</span></div>
              <h1 style="margin-top:14px;">25-Minute Nitro HIIT Challenge</h1><p>Push your pace with explosive intervals designed to maximize caloric afterburn.</p>
            </div>
            <div style="display:flex; gap:14px; flex-wrap:wrap;">
              <button class="btn-accent" style="width:auto; padding:14px 28px;" onclick="window.openWorkoutView(0)">▶ Start Workout Now</button>
            </div>
          </div>
          <div class="stats-row">
            <div class="stat-card"><div class="stat-value">${doneDrills * 95}</div><div class="stat-label">CALORIES BURNED</div></div>
            <div class="stat-card"><div class="stat-value">${doneDrills * 7} Min</div><div class="stat-label">ACTIVE TIME</div></div>
            <div class="stat-card"><div class="stat-value">${doneDrills}</div><div class="stat-label">DRILLS DONE</div></div>
            <div class="stat-card"><div class="stat-value" style="font-size:22px;">${activePlanTitle}</div><div class="stat-label">MEMBERSHIP</div></div>
          </div>
          <div class="filter-bar"><h2 style="font-size:24px;">Training Programs</h2><div class="filter-pills">${["All", "Speed HIIT", "Strength", "Core"].map(cat => `<button class="pill ${selectedCategory === cat ? 'active' : ''}" onclick="window.setCategory('${cat}')">${cat}</button>`).join("")}</div></div>
          <div class="workout-grid">${filtered.map(w => renderWorkoutCardHTML(w)).join("")}</div>
        </div>`;
      attachVideoHandlers();
    }

    function renderWorkoutCardHTML(w) {
      const locked = w.isPremium && !isPro;
      return `
        <div class="workout-card ${locked ? 'locked' : ''}" onclick="window.openWorkoutView(${w.id})">
          <div class="card-media" style="background-image:url('${w.image}');">
            <video class="card-video" autoplay muted loop playsinline preload="auto" poster="${w.image}"><source src="${w.video}" type="video/mp4"><source src="${w.videoFallback}" type="video/mp4"></video>
            <span class="card-cat">${w.category.toUpperCase()}</span>
            <span class="card-chip">${w.isPremium ? `<span class="pro-chip">💎 PRO</span>` : `<span class="free-chip">FREE</span>`}</span>
            ${locked ? `<div class="lock-overlay">🔒</div>` : ``}
          </div>
          <div class="card-body">
            <div><h3 style="font-size:20px; margin-bottom:8px;">${w.title}</h3></div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding-top:16px; border-top:1px solid rgba(255,255,255,0.08);">
              <div style="font-size:13px; color:var(--accent-bright); font-weight:700;">⏱ ${w.duration}</div>
              <button class="btn-outline" style="padding:6px 14px; font-size:13px;">${locked ? "🔒 Unlock" : "▶ Open"}</button>
            </div>
          </div>
        </div>`;
    }

    window.setCategory = function(cat) { selectedCategory = cat; renderDashboardPage(); }
    function renderWorkoutsPage() {
      pauseAllVideos();
      document.getElementById("main-content").innerHTML = `<div class="web-container"><h1 style="font-size:32px; margin-bottom:24px;">All Tracks</h1><div class="workout-grid">${workouts.map(w => renderWorkoutCardHTML(w)).join("")}</div></div>`;
      attachVideoHandlers();
    }

    window.openWorkoutView = function(id) {
      pauseAllVideos();
      const w = workouts[id];
      if (w.isPremium && !isPro) { window.openCodeModal(); return; }
      document.getElementById("main-content").innerHTML = `
        <div class="web-container">
          <button class="btn-outline" style="margin-bottom:24px;" onclick="window.switchPage('dashboard')">❮ Back</button>
          <div class="video-player-section"><span class="video-player-label">DEMO</span><video controls autoplay muted loop playsinline preload="metadata" poster="${w.image}"><source src="${w.video}" type="video/mp4"><source src="${w.videoFallback}" type="video/mp4"></video></div>
          <h3 style="font-size:20px; margin-bottom:16px;">Drills</h3>
          <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px;">${w.drills.map((d, i) => `<div onclick="window.toggleDrill(${w.id},${i})" style="background:var(--surface-dark); padding:20px; border-radius:14px; cursor:pointer; display:flex; align-items:center; gap:16px;"><input type="checkbox" ${d.done ? "checked" : ""} style="width:20px; height:20px; accent-color:var(--accent-bright);" /><div><h4 style="font-size:16px; ${d.done ? 'text-decoration:line-through;' : ''}">${d.name}</h4><p style="color:var(--accent-bright); font-size:13px;">${d.sets}</p></div></div>`).join("")}</div>
        </div>`;
      attachVideoHandlers();
    };
    window.toggleDrill = function(wId, dIdx) { workouts[wId].drills[dIdx].done = !workouts[wId].drills[dIdx].done; window.openWorkoutView(wId); };

    function renderPricingPage() {
      pauseAllVideos();
      document.getElementById("main-content").innerHTML = `<div class="web-container"><div style="text-align:center; margin-bottom:40px;"><h1 style="font-size:38px;">Choose Plan</h1></div><div class="pricing-grid"><div class="price-card"><h3>30-Day</h3><button class="btn-outline" onclick="window.fillAndOpen('NITRO99')">Use Code</button></div><div class="price-card featured"><h3>1-Year</h3><button class="btn-accent" onclick="window.fillAndOpen('FAST2026')">Use Code</button></div></div></div>`;
    }

    // AUTH
    window.openCodeModal = function() { document.getElementById("modal-code-msg").innerText = ""; document.getElementById("code-modal").style.display = "flex"; }
    window.closeCodeModal = function() { document.getElementById("code-modal").style.display = "none"; }
    window.fillCode = function(code) { document.getElementById("modal-code-input").value = code; }
    window.fillAndOpen = function(code) { window.openCodeModal(); window.fillCode(code); }

    window.handleFirebaseLogin = async function() {
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const msgEl = document.getElementById("login-error-msg");
      const btn = document.getElementById("login-btn");
      msgEl.innerText = ""; 
      if (!email || !password) { msgEl.innerText = "❌ Enter email and password."; return; }
      if (password.length < 6) { msgEl.innerText = "❌ Password must be 6+ chars."; return; }
      btn.innerText = "Connecting..."; btn.disabled = true;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
          try { await createUserWithEmailAndPassword(auth, email, password); } 
          catch (err) { msgEl.innerText = "❌ " + err.message; }
        } else { msgEl.innerText = "❌ " + error.message; }
      } finally { btn.innerText = "Sign In"; btn.disabled = false; }
    };

    window.handleGoogleLogin = async function() { try { await signInWithPopup(auth, googleProvider); } catch (error) { alert(error.message); } };
    window.logout = async function() { await signOut(auth); };

    window.activateCode = async function(inputId, msgId) {
      const code = document.getElementById(inputId).value.trim().toUpperCase();
      const msgEl = document.getElementById(msgId);
      const btn = document.getElementById("activate-btn");
      if (!code) { msgEl.style.color = "var(--danger)"; msgEl.innerText = "❌ Enter code."; return; }
      btn.innerText = "Checking..."; btn.disabled = true;
      try {
        const codeRef = doc(db, "activation_codes", code);
        const codeSnap = await getDoc(codeRef);
        if (codeSnap.exists()) {
          const data = codeSnap.data();
          if (data.is_used) { msgEl.style.color = "var(--danger)"; msgEl.innerText = "❌ Already used."; }
          else {
            await updateDoc(codeRef, { is_used: true, used_by: auth.currentUser.email });
            await updateDoc(doc(db, "users", auth.currentUser.uid), { isPro: true, plan: data.plan });
            msgEl.style.color = "var(--success)"; msgEl.innerText = `✅ Activated: ${data.plan}!`;
            setTimeout(() => { isPro = true; activePlanTitle = data.plan; window.updateNavbarStatus(); window.closeCodeModal(); window.switchPage("dashboard"); }, 1000);
          }
        } else { msgEl.style.color = "var(--danger)"; msgEl.innerText = "❌ Invalid code."; }
      } catch (error) { msgEl.style.color = "var(--danger)"; msgEl.innerText = "❌ DB Error."; } finally { btn.innerText = "Unlock"; btn.disabled = false; }
    };

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          const userRef = doc(db, "users", user.uid);
          const userSnap = await getDoc(userRef);
          if (userSnap.exists()) { const data = userSnap.data(); isPro = data.isPro || false; activePlanTitle = data.plan || "Free Tier"; } 
          else { await setDoc(userRef, { email: user.email, isPro: false, plan: "Free Tier" }); isPro = false; activePlanTitle = "Free Tier"; }
        } catch (e) { console.error(e); isPro = false; activePlanTitle = "Free Tier (DB Error)"; }
        currentUser = { name: user.email.split("@")[0], email: user.email };
        document.getElementById("top-nav").style.display = "block";
        window.updateNavbarStatus();
        window.switchPage("dashboard");
      } else { currentUser = null; isPro = false; window.renderLoginView(); }
    });

    document.addEventListener("visibilitychange", () => { if (document.hidden) pauseAllVideos(); });
  </script>
</body>
</html>
